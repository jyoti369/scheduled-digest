name: CI

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Random delay (light jitter)
        run: sleep $((RANDOM % 60))

      - name: Run
        env:
          AUTH_COOKIES: ${{ secrets.AUTH_COOKIES }}
          SOURCE_BASE: ${{ secrets.SOURCE_BASE }}
          REWARD_FIELD: ${{ secrets.REWARD_FIELD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 src/core/runner.py

      - name: Commit state if changed
        if: always()
        run: |
          if [[ -n "$(git status --porcelain src/core/state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/core/state.json
            git commit -m "update state"
            # another run may have pushed in the meantime; rebase + retry so a
            # push race never fails the job
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              echo "push attempt $i failed, retrying"
              sleep 3
            done
          fi
